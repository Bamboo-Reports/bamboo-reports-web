[build]
  # Next.js static export (output: "export" in next.config.ts)
  command = "npm run build"
  publish = "out"

# Legacy URL redirects live in public/_redirects. Unknown URLs fall through
# to the exported 404.html with a real 404 status.

# Force the raw Netlify alias onto the real domain. All bot management and
# rate limiting live on Cloudflare in front of bambooreports.com; without this,
# scrapers hitting the *.netlify.app origin would bypass every protection.
# Deploy previews (deploy-preview-N--staging-bambooreports.netlify.app) are
# different hostnames and are not affected.
[[redirects]]
  from = "https://staging-bambooreports.netlify.app/*"
  to = "https://bambooreports.com/:splat"
  status = 301
  force = true

# Pages that carry a noindex robots meta tag also send the header.
[[headers]]
  for = "/thank-you"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/map-your-gcc-opportunity"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

# Build settings
[build.environment]
  NODE_VERSION = "22"

# Local dev server settings (netlify dev)
[dev]
  command = "npm run dev"
  targetPort = 8080
  framework = "#custom"
