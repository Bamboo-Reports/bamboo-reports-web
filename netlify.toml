[build]
  # Build command for your React/Vite app
  command = "npm run build"
  # Directory to publish (output of vite build)
  publish = "dist"
  # Functions directory
  functions = "netlify/functions"

# Redirect rules for SPA (Single Page Application)
# NOTE: More specific redirects (like /api/* below) must come BEFORE the catch-all "/*" rule,
# because Netlify evaluates redirects in file order.

# Force the raw Netlify alias onto the real domain. All bot management and
# rate limiting live on Cloudflare in front of bambooreports.com; without this,
# scrapers hitting the *.netlify.app origin would bypass every protection.
# Deploy previews (deploy-preview-N--staging-bambooreports.netlify.app) are
# different hostnames and are not affected.
[[redirects]]
  from = "https://staging-bambooreports.netlify.app/*"
  to = "https://bambooreports.com/:splat"
  status = 301
  force = true

# NOTE: /api/tracker/query is routed by the function's own `config.path`
# (netlify/functions/tracker-query.js), which also declares its rate limit.
# No redirect needed here.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Build settings
[build.environment]
  NODE_VERSION = "18"

# Function settings
[functions]
  # Directory for serverless functions
  directory = "netlify/functions"
  # Use ESM modules
  node_bundler = "esbuild"

# NOTE: the tracker dataset in netlify/functions/_data/ is inlined into the
# tracker-query bundle by esbuild via a plain JSON import. It must never be
# copied into public/ or it defeats the whole point.

# Local dev server settings (netlify dev)
[dev]
  command = "npm run dev"
  targetPort = 8080
  framework = "#custom"
